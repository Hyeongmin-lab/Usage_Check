name: 빌드 · 릴리스

# PR: 테스트 + exe 빌드 확인 (아티팩트로만 보관)
# main 에 머지: aiquota.py 의 VERSION 에 해당하는 릴리스(vX.Y.Z)가 아직 없으면
#               → 태그 생성 + 빌드 출처 증명 + GitHub Release 게시 (자동 배포)
# v* 태그 직접 푸시: 같은 방식으로 게시
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 테스트 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 보안·기능 테스트
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

  build:
    name: AIQuota.exe 빌드
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write        # Release 게시
      id-token: write        # 빌드 출처 증명
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 릴리스할지 판단
        id: rel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path aiquota.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          $tag = "v$v"
          $release = "false"
          if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
            if ("${{ github.ref_name }}" -ne $tag) { throw "태그(${{ github.ref_name }})와 aiquota.py VERSION($tag)이 달라요" }
            $release = "true"
          } elseif ("${{ github.event_name }}" -eq "push" -and "${{ github.ref }}" -eq "refs/heads/main") {
            gh release view $tag --repo "${{ github.repository }}" *> $null
            if ($LASTEXITCODE -ne 0) { $release = "true"; "새 버전 $tag → 이번 빌드를 릴리스해요" } else { "$tag 는 이미 릴리스됨 → 빌드만 확인" }
            $global:LASTEXITCODE = 0
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT

      - name: PyInstaller 설치
        run: python -m pip install --upgrade pip "pyinstaller>=6.10,<7"

      - name: exe 빌드
        run: pyinstaller --noconfirm --clean --onefile --windowed --name AIQuota --icon assets/icon.ico --add-data "assets/icon.ico;assets" aiquota.py

      - name: 실행 확인 (위젯이 켜져서 유지되는지)
        shell: pwsh
        run: |
          $env:AIQUOTA_CONFIG  = "$env:RUNNER_TEMP\cfg.json"
          $env:AIQUOTA_CACHE   = "$env:RUNNER_TEMP\cache.json"
          $env:AIQUOTA_HISTORY = "$env:RUNNER_TEMP\hist.jsonl"
          $p = Start-Process -FilePath dist\AIQuota.exe -ArgumentList "--widget","--demo" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "AIQuota.exe 가 바로 종료됐어요 (exit $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          "OK: 위젯이 20초 동안 정상 실행됨"

      - name: 배포 파일 만들기 (+ SHA-256)
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item dist\AIQuota.exe out\
          $py = "AIQuota-python"
          New-Item -ItemType Directory "$py\assets" -Force | Out-Null
          Copy-Item aiquota.py,README.md,LICENSE,SECURITY.md,CHANGELOG.md,_find_python.cmd -Destination $py\
          Copy-Item *.bat -Destination $py\
          Copy-Item assets\icon.ico -Destination "$py\assets\"
          Compress-Archive -Path "$py\*" -DestinationPath out\AIQuota-python.zip
          $lines = Get-ChildItem out -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $lines | Set-Content out\SHA256SUMS.txt -Encoding ascii
          Get-Content out\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AIQuota-${{ github.sha }}
          path: out/*
          retention-days: 14

      - name: 빌드 출처 증명 (이 저장소 코드로 GitHub가 빌드했음을 서명)
        if: steps.rel.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/AIQuota.exe
            out/AIQuota-python.zip

      - name: 릴리스 노트 만들기
        if: steps.rel.outputs.release == 'true'
        env:
          PYTHONIOENCODING: utf-8
        run: python .github/scripts/release_notes.py "${{ steps.rel.outputs.tag }}" "${{ runner.temp }}\notes.md"

      - name: GitHub Release 게시
        if: steps.rel.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: AI 쿼터 ${{ steps.rel.outputs.tag }}
          body_path: ${{ runner.temp }}/notes.md
          files: |
            out/AIQuota.exe
            out/AIQuota-python.zip
            out/SHA256SUMS.txt
